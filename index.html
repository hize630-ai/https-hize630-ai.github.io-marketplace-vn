<style>
:root{--bg:#1e1e1f;--card:#313233;--card2:#48494a;--line:#58585a;--text:#fff;--mute:#b1b2b5;--g1:#3c8527;--g2:#52a535;--g3:#1d4d13;--gold:#ffe866}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans",Arial,sans-serif;line-height:1.55;font-size:16px}
a{color:inherit;text-decoration:none}
.px{font-family:"Pixelify Sans","Noto Sans",monospace;letter-spacing:.3px}
.wrap{max-width:1240px;margin:auto;padding:0 20px}
/* header */
header{background:#000;position:sticky;top:0;z-index:30}
.bar{display:flex;align-items:center;height:64px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:18px;white-space:nowrap}
.brand i{width:30px;height:30px;display:block;background:linear-gradient(#62c540 0 28%,#8a5a35 28%);border:3px solid #2b2b2b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.brand b{font-size:20px;text-transform:uppercase}
nav{display:flex;gap:2px}
nav a{padding:22px 14px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.4px;color:#e7e7e7;border-bottom:4px solid transparent}
nav a:hover,nav a.on{border-bottom-color:var(--g2);color:#fff}
.right{margin-left:auto;display:flex;align-items:center;gap:12px}
.coins{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}

.logo{height:42px;width:auto;display:block}
/* buttons - bevel style */
.btn{display:inline-block;font-weight:700;font-size:15px;padding:11px 26px;cursor:pointer;color:#fff;background:var(--g1);border:2px solid var(--g3);border-radius:2px;box-shadow:inset 0 -4px 0 var(--g3),inset 2px 2px 0 rgba(255,255,255,.28);text-align:center}
.btn:hover{background:var(--g2)}
.btn.grey{background:#6c6d70;border-color:#313233;box-shadow:inset 0 -4px 0 #313233,inset 2px 2px 0 rgba(255,255,255,.25)}
.btn.grey:hover{background:#7e7f82}
.btn.sm{padding:8px 18px;font-size:13px}
/* hero */
.hero{position:relative;min-height:360px;display:flex;align-items:flex-end;background:linear-gradient(0deg,var(--bg) 0,rgba(30,30,31,.15) 55%),linear-gradient(120deg,#16314f,#2d6a2d 50%,#6b4a2b);border-bottom:4px solid var(--g1)}
.hero .wrap{padding-bottom:36px;width:100%}
.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.1;text-shadow:0 4px 0 rgba(0,0,0,.45)}
.hero p{max-width:560px;margin:10px 0 20px;color:#e6e6e6}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:42px 0 16px}
.sec-h h2{font-size:28px}
.sec-h a{color:var(--g2);font-weight:700;font-size:14px}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cat{height:150px;position:relative;display:flex;align-items:flex-end;padding:14px;cursor:pointer;border:3px solid #000;overflow:hidden;transition:.15s}
.cat:hover{border-color:var(--g2);transform:translateY(-3px)}
.cat span{position:absolute;right:12px;top:6px;font-size:52px;opacity:.9}
.cat h3{font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:3px solid #000;display:flex;flex-direction:column;transition:.15s;cursor:pointer}
.card:hover{transform:translateY(-4px);border-color:var(--g2)}
.thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:60px;background-size:cover;background-position:center;border-bottom:3px solid #000}
.cinfo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.cinfo h3{font-size:18px}
.cinfo small{color:var(--mute);font-size:13px}
.stars{color:var(--gold);font-size:14px;letter-spacing:2px}
.price{margin-top:auto;padding-top:8px;font-weight:700;display:flex;align-items:center;gap:6px}
.free{color:var(--g2)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{padding:7px 16px;background:var(--card);border:2px solid #000;font-weight:700;font-size:14px;cursor:pointer}
.chip.on,.chip:hover{background:var(--g1);border-color:var(--g3)}
.filters input{margin-left:auto;background:#000;border:2px solid var(--line);color:#fff;padding:8px 12px;min-width:220px;font-size:14px}
.filters input:focus{outline:none;border-color:var(--g2)}
/* product detail page */
.crumb{margin:22px 0 14px;color:var(--mute);font-size:14px}
.crumb a:hover{color:#fff;text-decoration:underline}
.pdp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px}
.pdp .main{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:130px;border:3px solid #000;background-size:cover;background-position:center}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.shots div{aspect-ratio:16/9;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.85;cursor:pointer}
.shots div:hover{opacity:1;border-color:var(--g2)}
.side{background:var(--card);border:3px solid #000;padding:22px;display:flex;flex-direction:column;gap:12px;align-self:start}
.side h1{font-size:32px;line-height:1.15}
.by{color:var(--mute);font-size:14px}.by b{color:var(--g2)}
.bigprice{font-size:26px;font-weight:700;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;border-top:2px solid var(--line);padding-top:12px}
.kv dt{color:var(--mute)}
.desc{margin-top:26px;max-width:820px}
.desc h2{font-size:24px;margin-bottom:8px}
.desc p{color:#dcdcdf}
footer{margin-top:64px;background:#000;padding:34px 0;color:var(--mute);font-size:13px;border-top:4px solid var(--g1)}
footer p+p{margin-top:6px}
html,body{max-width:100%;overflow-x:hidden}
.coins{cursor:pointer}.coins:hover{color:var(--gold)}
#acc{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authbox{max-width:420px;margin:20px auto;background:var(--card);border:3px solid #000;padding:24px;display:flex;flex-direction:column;gap:12px}
.authbox input,.authbox select,.authbox textarea{font-family:inherit;background:#000;border:2px solid var(--line);color:#fff;padding:11px 12px;font-size:15px;width:100%}
.authbox input:focus,.authbox select:focus,.authbox textarea:focus{outline:none;border-color:var(--g2)}
.authbox code{background:#000;padding:1px 6px}
header{background:linear-gradient(180deg,#3b3626,#19170f)}
.btn.ghost{background:transparent;border:3px solid var(--g1);color:var(--g2);box-shadow:none;text-transform:uppercase;letter-spacing:.4px}
.btn.ghost:hover{background:rgba(60,133,39,.25)}
.hex{display:none;width:42px;height:46px;border:0;background:var(--g1);color:#fff;font-size:20px;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.m-only{display:none}
nav{min-width:0}
.catrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:6px}
.crow{display:flex;align-items:center;gap:16px;padding:20px 18px;background:#111;border:5px solid transparent;border-left-color:#2e2e2e;border-bottom-color:#3a3a3a;font-size:21px;color:#fff;transition:.12s}
.crow svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;flex:none}
.crow:hover,.crow:focus,.crow.on{border:5px solid var(--gold);background:radial-gradient(ellipse at 50% 100%,rgba(255,200,61,.28),#0c0c0c 75%);box-shadow:0 0 0 2px #fff,0 0 28px rgba(255,200,61,.35);text-decoration:underline;outline:0}
@media(max-width:860px){.hex{display:block}.m-only{display:block}#acc{display:none}nav.open{display:flex;flex-direction:column;position:fixed;top:56px;left:0;right:0;bottom:0;background:#141414;z-index:25;overflow:auto}nav.open a{padding:18px 20px;border-bottom:1px solid #2a2a2a;font-size:16px}nav.open a.on{background:#1f2a1b}.crow{font-size:18px;padding:16px 14px}.btn.ghost.sm{padding:6px 10px;font-size:12px}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0 16px}
.day{background:var(--card);border:3px solid #000;text-align:center;padding:10px 2px;font-size:13px;color:var(--mute)}
.day b{display:block;color:#fff;font-size:16px}
.day.ok{background:var(--g1);border-color:var(--g3);color:#fff}
.quests{display:grid;gap:10px;margin-top:12px}
.quest{background:var(--card);border:3px solid #000;padding:14px 16px;display:flex;align-items:center;gap:14px}
.quest h3{font-size:17px}.quest small{color:var(--mute)}
.quest>div{flex:1;min-width:0}
.btn[disabled],.btn.off{opacity:.55;pointer-events:none}
.up{display:flex;flex-direction:column;gap:6px;font-size:14px}.up small{color:var(--mute)}.authbox input[type=file]{padding:9px;cursor:pointer}.prev{width:100%;aspect-ratio:16/9;object-fit:cover;border:3px solid #000}.bar2{height:10px;background:#000;border:2px solid var(--line)}.bar2 i{display:block;height:100%;width:0;background:var(--g2);transition:width .15s}
.empty{color:var(--mute);padding:10px 0}
.note{margin-top:22px;padding:14px 16px;border:2px dashed var(--line);color:var(--mute);font-size:13px}
.brand{min-width:0}
.brand b{overflow:hidden;text-overflow:ellipsis}
.right{flex-shrink:0}
@media(max-width:860px){nav{display:none}.pdp{grid-template-columns:1fr}.filters input{margin-left:0;width:100%;min-width:0}.brand{margin-right:0;flex:1}.brand i{flex-shrink:0;width:26px;height:26px}.brand b{font-size:13px;line-height:1.15;white-space:normal}.logo{height:34px;max-width:100%;object-fit:contain;object-position:left}.coins{font-size:12px;gap:4px}.days{gap:4px}.day{font-size:11px}.quest{flex-wrap:wrap}.btn.sm{padding:7px 12px;font-size:12px;white-space:nowrap}.wrap{padding:0 14px}.bar{height:56px;gap:10px}.hero{min-height:280px}.sec-h h2{font-size:22px}.cats{grid-template-columns:1fr 1fr}.cat{height:110px}.cat span{font-size:36px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.thumb{font-size:42px}.cinfo h3{font-size:15px}.side h1{font-size:26px}.pdp .main{font-size:80px}}
</style>
</head>

/* ===== HỆ THỐNG XU (lưu trong trình duyệt của từng người) ===== */
const QUESTS = [
  {id:"yt",name:"Theo dõi kênh YouTube",reward:30,link:"https://www.youtube.com/",once:true},
  {id:"dc",name:"Tham gia Discord cộng đồng",reward:30,link:"https://discord.com/",once:true},
  {id:"fb",name:"Theo dõi fanpage Facebook",reward:20,link:"https://www.facebook.com/",once:true},
  {id:"share",name:"Chia sẻ trang cho bạn bè",reward:10,link:"share",once:false}
];
const DAILY = [10,10,15,15,20,20,50];
const KEY = "mmvn_state";
let S = {coins:0,lastDaily:"",streak:0,done:{},owned:[]}, busy = {};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){}
const today = () => new Date().toISOString().slice(0,10);
const yest = () => new Date(Date.now() - 864e5).toISOString().slice(0,10);
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(user && db){ clearTimeout(pushT); pushT = setTimeout(() => db.collection("users").doc(user.uid).set(S).catch(()=>{}), 600); }
  const b = $("#bal"); if(b) b.textContent = isAdmin() ? "∞" : S.coins.toLocaleString("vi-VN");
}
const buyBtn = p => {
  if(p.price===0 || S.owned.includes(p.id) || isAdmin()) return `<a class="btn" href="${p.link}" download ${/^https?:/.test(p.link) && !p.link.startsWith(location.origin) ? 'target="_blank"' : ''} rel="noopener">Tải &amp; nạp vào Minecraft</a>`;
  if(S.coins >= p.price) return `<a class="btn" href="#" onclick="redeem('${p.id}');return false">Đổi ${p.price.toLocaleString("vi-VN")} xu</a>`;
  return `<a class="btn grey" href="#/earn">Cần thêm ${(p.price-S.coins).toLocaleString("vi-VN")} xu · Kiếm xu</a>`;
};
function redeem(id){
  const p = P.find(x => x.id == id);
  if(!p || S.coins < p.price || S.owned.includes(p.id)) return;
  S.coins -= p.price; S.owned.push(p.id); save(); item(id);
}
function checkin(){
  const t = today(); if(S.lastDaily === t) return;
  S.streak = S.lastDaily === yest() ? S.streak + 1 : 1;
  S.coins += DAILY[(S.streak-1) % 7]; S.lastDaily = t; save(); earn();
}
function doQuest(id){
  const q = QUESTS.find(x => x.id === id), t = today();
  if(busy[id] || (q.once ? S.done[id] : S.done[id] === t)) return;
  if(q.link === "share"){
    const d = {title:document.title, url:location.href.split("#")[0]};
    if(navigator.share) navigator.share(d).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(d.url).catch(()=>{});
  } else window.open(q.link, "_blank", "noopener");
  busy[id] = true; earn();
  setTimeout(() => {
    busy[id] = false; S.done[id] = q.once ? true : t; S.coins += q.reward; save();
    if(location.hash === "#/earn") earn();
  }, 10000);
}
function earn(){
  const t = today(), done = S.lastDaily === t;
  const ok = done ? ((S.streak-1) % 7) + 1 : (S.lastDaily === yest() ? S.streak % 7 : 0);
  V.innerHTML = `<main class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> › Kiếm xu</div>
    <h1 class="px" style="font-size:36px">Kiếm xu</h1>
    <p style="color:var(--mute);margin-top:4px">Số dư hiện tại: <b style="color:#fff"><span class="mc"></span> ${isAdmin() ? "∞ (vô hạn)" : S.coins.toLocaleString("vi-VN")} xu</b></p>
    <div class="sec-h" style="margin-top:28px"><h2 class="px">Điểm danh hằng ngày</h2></div>
    <div class="days">${DAILY.map((r,i)=>`<div class="day ${i<ok?"ok":""}">Ngày ${i+1}<b>+${r}</b></div>`).join("")}</div>
    <a class="btn ${done?"off":""}" href="#" onclick="checkin();return false">${done?"Hôm nay đã điểm danh ✓":"Điểm danh nhận xu"}</a>
    <div class="sec-h"><h2 class="px">Nhiệm vụ</h2></div>
    <div class="quests">${QUESTS.map(q=>{
      const d = q.once ? S.done[q.id] : S.done[q.id] === t, b = busy[q.id];
      return `<div class="quest"><div><h3>${q.name}</h3><small>+${q.reward} xu ${q.once?"· một lần":"· mỗi ngày"}</small></div>
        <a class="btn sm ${d||b?"off":""}" href="#" onclick="doQuest('${q.id}');return false">${d?"Đã nhận ✓":b?"Đang xác nhận...":"Làm ngay"}</a></div>`;}).join("")}</div>
    <div class="note">Xu chỉ dùng trong trang này để đổi sản phẩm, không phải Minecoin thật của Minecraft. Xu được lưu trên trình duyệt của bạn, nên đổi trình duyệt hoặc xóa dữ liệu sẽ mất xu.${fbOn()&&!user?'<br><a href="#/login" style="color:var(--g2);font-weight:700">Đăng nhập</a> để lưu xu trên mọi thiết bị.':''}</div></main>`;
}

const isAdminEmail = () => !!(user && user.email && ADMIN_EMAILS.includes(user.email.toLowerCase()));
const isAdmin = () => isAdminEmail() && user.emailVerified;
const okImg = u => okUrl(u) || /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u || "");
const okUrl = u => /^https?:\/\/[^\s'"()<>]+$/.test(u || "");
const PAL = [["#3c8527","#7a5230"],["#2a5db0","#8e44ad"],["#c0392b","#f5b041"],["#154360","#5dade2"],["#1e3d2a","#6c3483"]];
const clean = (id, d) => ({id, cloud:true, name:esc(d.name||""), creator:esc(d.creator||""),
  cat:CATS.some(c => c.id === d.cat) ? d.cat : "addon", price:Math.max(0, +d.price || 0),
  rating:Math.min(5, +d.rating || 5), size:esc(d.size||"—"), emoji:esc(d.emoji||"📦"),
  c1:/^#[0-9a-f]{6}$/i.test(d.c1) ? d.c1 : "#3c8527", c2:/^#[0-9a-f]{6}$/i.test(d.c2) ? d.c2 : "#7a5230",
  link:okUrl(d.link) ? d.link : "#", image:okImg(d.image) ? d.image : "", path:esc(d.path||""), shots:[], desc:esc(d.desc||"")});
function loadProducts(){
  db.collection("products").orderBy("created","desc").get().then(s => {
    for(let i = P.length - 1; i >= 0; i--) if(P[i].cloud) P.splice(i, 1);
    P.unshift(...s.docs.map(x => clean(x.id, x.data())));
    route();
  }).catch(()=>{});
}

function loadPending(){
  db.collection("submissions").get().then(s => {
    SUB = s.docs.map(x => Object.assign({id:x.id}, x.data())).filter(x => x.status === "pending").sort((a, b) => (a.created || 0) - (b.created || 0));
    const el = $("#pend"); if(!el) return;
    el.innerHTML = SUB.map(x => `<div class="quest">${okImg(x.image) ? `<img src="${x.image}" alt="" style="width:84px;aspect-ratio:16/9;object-fit:cover;border:2px solid #000">` : ""}

      ${okUrl(x.link) ? `<a class="btn sm grey" href="${x.link}" target="_blank" rel="noopener">Tải thử</a>` : ""}
      <a class="btn sm" href="#" onclick="approve('${esc(x.id)}');return false">Duyệt</a>
      <a class="btn sm grey" href="#" onclick="reject('${esc(x.id)}');return false">Từ chối</a></div>`).join("") || '<p class="empty">Không có yêu cầu nào.</p>';
  }).catch(() => { const el = $("#pend"); if(el) el.innerHTML = '<p class="empty">Không tải được yêu cầu. Kiểm tra Firestore Rules cho "submissions".</p>'; });
}
async function approve(id){
  if(!isAdmin()) return;
  const x = SUB.find(v => v.id === id); if(!x) return;
  if(!okUrl(x.link)) return alert("Link file không hợp lệ.");
  const pr = prompt("Giá (xu), 0 = miễn phí:", "0"); if(pr === null) return;
  const c = PAL[Math.floor(Math.random() * PAL.length)];
  const d = {name:x.name, creator:x.creator, cat:x.cat, price:Math.max(0, parseInt(pr) || 0), size:x.size || "—", link:x.link,
    image:okImg(x.image) ? x.image : "", path:x.path || "", desc:x.desc, rating:5, emoji:"📦", c1:c[0], c2:c[1], created:Date.now(), by:x.by};
  try{
    const r = await db.collection("products").add(d);
    await db.collection("submissions").doc(id).delete();
    P.unshift(clean(r.id, d)); admin();
  }catch(e){ alert("Không duyệt được. Kiểm tra Firestore Rules."); }
}
async function reject(id){
  if(!isAdmin() || !confirm("Từ chối và xóa yêu cầu này?")) return;
  const x = SUB.find(v => v.id === id);
  try{
    await db.collection("submissions").doc(id).delete();
    if(x && /^submissions\//.test(x.path || "") && storage){ try{ await storage.ref(x.path).delete(); }catch(e){} }
    admin();
  }catch(e){ alert("Không xóa được."); }
}
function submit(){
  if(!user) return V.innerHTML = NEED("Gửi yêu cầu đăng Addon", `<p>Bạn cần đăng nhập để gửi Addon.</p><a class="btn" href="#/login">Đăng nhập</a>`);
  if(!user.emailVerified) return V.innerHTML = NEED("Cần xác minh email", `<p>Hãy xác minh email để gửi Addon (đăng nhập bằng Google sẽ được xác minh sẵn).</p>
    <a class="btn" href="#" onclick="auth.currentUser.sendEmailVerification().then(()=>alert('Đã gửi email xác minh. Sau khi xác minh, hãy đăng nhập lại.'));return false">Gửi email xác minh</a>`);
  V.innerHTML = `<main class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> › Gửi yêu cầu đăng Addon</div>${modForm("user")}
    <div class="sec-h"><h2 class="px">Yêu cầu của bạn</h2></div><div class="quests" id="mysub"><p class="empty">Đang tải...</p></div></main>`;
  bindForm(); loadMine();
}
function loadMine(){
  db.collection("submissions").where("by", "==", user.uid).get().then(s => {
    SUB = s.docs.map(x => Object.assign({id:x.id}, x.data())).sort((a, b) => (b.created || 0) - (a.created || 0));
    const el = $("#mysub"); if(!el) return;
    el.innerHTML = SUB.map(x => `<div class="quest"><div><h3>${esc(x.name||"")}</h3><small>${esc(cn(x.cat))} · ${esc(x.size||"—")} · Đang chờ duyệt</small></div>
      <a class="btn sm grey" href="#" onclick="cancelSub('${esc(x.id)}');return false">Hủy</a></div>`).join("") || '<p class="empty">Bạn chưa gửi yêu cầu nào đang chờ duyệt.</p>';
  }).catch(() => {});
}
async function cancelSub(id){
  if(!confirm("Hủy yêu cầu này?")) return;
  const x = SUB.find(v => v.id === id);
  try{
    await db.collection("submissions").doc(id).delete();
    if(x && x.path && storage){ try{ await storage.ref(x.path).delete(); }catch(e){} }
    submit();
  }catch(e){ alert("Không hủy được."); }
}
/* Thu nhỏ ảnh về tối đa 1000px, JPEG, để lưu gọn trong Firestore */
function shrink(file){
  return new Promise((ok, no) => {
    const fr = new FileReader();
    fr.onerror = () => no();
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => no();
      im.onload = () => {
        const k = Math.min(1, 1000 / Math.max(im.width, im.height)), c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        let q = .85, u = c.toDataURL("image/jpeg", q);
        while(u.length > 600000 && q > .4){ q -= .1; u = c.toDataURL("image/jpeg", q); }
        ok(u);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace(".0","") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
async function postMod(mode){
  const adm = mode === "admin";
  if(adm ? !isAdmin() : !(user && user.emailVerified)) return;
  const g = id => $("#" + id).value.trim(), msg = $("#m_msg"), btn = $("#m_btn"), bar = $("#m_bar"), fill = $("#m_fill");
  const bad = t => { msg.style.color = "#ff7b7b"; msg.textContent = t; btn.classList.remove("off"); bar.hidden = true; };
  if(btn.classList.contains("off")) return;
  const img = $("#m_imgf").files[0];
  const d = {name:g("m_name"), creator:g("m_creator"), cat:g("m_cat"), desc:g("m_desc")};
  if(adm) d.price = Math.max(0, parseInt(g("m_price")) || 0);
  if(!d.name || !d.creator || !d.desc) return bad("Vui lòng điền tên, tác giả và mô tả.");
  const link = g("m_link");
  if(!link) return bad("Vui lòng dán link MediaFire của file Addon.");
  if(!/^https:\/\/(www\.)?mediafire\.com\/[^\s'"()<>]+$/i.test(link)) return bad("Link phải là link MediaFire hợp lệ (bắt đầu bằng https://www.mediafire.com/).");
  btn.classList.add("off"); msg.style.color = "var(--mute)"; msg.textContent = "Đang gửi..."; bar.hidden = true;
  try{
    d.image = img ? await shrink(img) : "";
    d.path = "";
    d.link = link;
    d.size = g("m_size") || "—";
    d.created = Date.now(); d.by = user.uid;
    if(adm){
      const c = PAL[Math.floor(Math.random() * PAL.length)];
      Object.assign(d, {rating:5, emoji:"📦", c1:c[0], c2:c[1]});
      const r = await db.collection("products").add(d);
      P.unshift(clean(r.id, d)); admin();
      const m = $("#m_msg"); m.style.color = "#52a535"; m.textContent = "Đã đăng thành công ✓";
    } else {
      Object.assign(d, {status:"pending", byEmail:user.email || ""});
      await db.collection("submissions").add(d);
      submit();
      const m = $("#m_msg"); m.style.color = "#52a535"; m.textContent = "Đã gửi yêu cầu ✓ Quản trị viên sẽ xem xét sớm.";
    }
  }catch(e){
    bad("Không gửi được. Kiểm tra Firestore Rules và tài khoản." + (e && e.code ? " (" + e.code + ")" : ""));
  }
}
async function delMod(id){
  if(!isAdmin() || !confirm("Xóa mod này?")) return;
  const p = P.find(x => x.id === id);
  try{
    await db.collection("products").doc(id).delete();
    if(p && p.path && storage){ try{ await storage.ref(p.path).delete(); }catch(e){} }
    const i = P.findIndex(x => x.id === id); if(i > -1) P.splice(i, 1);
    admin();
  }catch(e){ alert("Không xóa được."); }
}
function login(){
  let h;
  if(!fbOn()) h = `<p>Chưa cấu hình đăng nhập. Mở file HTML và điền <code>FIREBASE_CONFIG</code> trong phần script.</p>`;
  else if(user) h = `<p>Xin chào, <b>${esc(nameOf(user))}</b></p><p style="color:var(--mute)">${esc(user.email||"")}</p>
    <p><span class="mc"></span> ${isAdmin() ? "∞ (vô hạn)" : S.coins.toLocaleString("vi-VN")} xu · Đã sở hữu ${isAdmin() ? "tất cả" : S.owned.length} sản phẩm</p>
    ${isAdmin() ? '<a class="btn" href="#/admin">Quản trị &amp; đăng mod</a>' : isAdminEmail() ? '<p style="color:#ff7b7b;font-size:14px">Email quản trị chưa được xác minh. Hãy đăng nhập bằng Google hoặc xác minh email để đăng mod.</p><a class="btn grey" href="#" onclick="auth.currentUser.sendEmailVerification().then(()=>alert(\'Đã gửi email xác minh.\'));return false">Gửi email xác minh</a>' : '<a class="btn" href="#/submit">Gửi yêu cầu đăng Addon</a>'}
    <a class="btn grey" href="#" onclick="logout();return false">Đăng xuất</a>`;
  else h = `<input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
    <p id="aerr" style="color:#ff7b7b;font-size:14px;min-height:20px"></p>
    <a class="btn" href="#" onclick="doAuth('in');return false">Đăng nhập</a>
    <a class="btn grey" href="#" onclick="doAuth('up');return false">Tạo tài khoản</a>
    <a class="btn grey" href="#" onclick="google();return false">Đăng nhập với Google</a>`;
  V.innerHTML = `<main class="wrap"><div class="crumb"><a href="#/">Trang chủ</a> › Tài khoản</div>
    <div class="authbox"><h1 class="px" style="font-size:30px">${user?"Tài khoản":"Đăng nhập"}</h1>${h}</div></main>`;
}
function route(){
  const [,t,a] = location.hash.split("/");
  window.scrollTo(0,0);
  if(t==="p") item(a); else if(t==="c") list(a||"all"); else if(t==="earn") earn(); else if(t==="login") login(); else if(t==="admin") admin(); else if(t==="submit") submit(); else home();
  document.querySelectorAll("nav a").forEach(l => l.classList.toggle("on", l.dataset.n === (t==="c"?a:t==="p"?(P.find(x=>x.id==a)||{}).cat:t==="earn"?"earn":(t==="submit"||t==="admin")?"submit":"home")));
  save();
}
function buildNav(){
  $("#nav").innerHTML = `<a href="#/" data-n="home">Trang chủ</a>` +
    CATS.map(c => `<a href="#/c/${c.id}" data-n="${c.id}">${c.name}</a>`).join("") +
    `<a href="#/submit" data-n="submit">Gửi Addon</a><a href="#/earn" data-n="earn">Kiếm xu</a><a href="#/login" class="acc m-only">Đăng nhập</a>`;
}
buildNav(); updateAcc();
$("#menuBtn").onclick = () => $("#nav").classList.toggle("open");
